<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Monitor</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <main class="page">
        <header class="header">
            <div>
                <p class="label">PostgreSQL · Debezium · Kafka</p>
                <h1>Order Monitor</h1>
            </div>
            <div class="status">
                <span id="connectionDot" class="dot"></span>
                <span id="connectionText">Connecting</span>
            </div>
        </header>

        <section class="summary" aria-label="Order summary">
            <div>
                <span>Total</span>
                <strong id="totalOrders">0</strong>
            </div>
            <div>
                <span>Active</span>
                <strong id="activeOrders">0</strong>
            </div>
            <div>
                <span>Last event</span>
                <strong id="latestEvent">None</strong>
            </div>
        </section>

        <section class="toolbar">
            <input id="searchInput" type="search" placeholder="Search orders...">
            <button id="createOrderBtn" type="button" class="btn-primary">+ Create Order</button>
            <button id="clearFeed" type="button">Clear Feed</button>
        </section>

        <section class="layout">
            <section class="panel">
                <div class="panel-title">
                    <h2>Orders</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Product</th>
                                <th>Status</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody"></tbody>
                    </table>
                    <p id="ordersEmpty" class="empty">No orders found.</p>
                </div>
            </section>

            <aside class="panel feed-panel">
                <div class="panel-title">
                    <h2>Event Feed</h2>
                </div>
                <div id="eventFeed" class="feed">
                    <p class="empty">Waiting for changes.</p>
                </div>
            </aside>
        </section>
    </main>

    <!-- Modal for Create / Edit Order -->
    <div id="orderModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Order</h3>
                <button id="closeModalBtn" type="button" class="close-btn">&times;</button>
            </div>
            <form id="orderForm">
                <input type="hidden" id="orderId">
                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="e.g. Rahul Verma" required>
                </div>
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" placeholder="e.g. Noise Cancelling Headphones" required>
                </div>
                <div class="form-group">
                    <label for="orderStatus">Status</label>
                    <select id="orderStatus" class="select-input">
                        <option value="pending">pending</option>
                        <option value="processing">processing</option>
                        <option value="packed">packed</option>
                        <option value="shipped">shipped</option>
                        <option value="delivered">delivered</option>
                        <option value="cancelled">cancelled</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn-primary" id="saveOrderBtn">Save Order</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=5"></script>
</body>
</html>
